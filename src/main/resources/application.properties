spring.application.name=focuslog-api
# Porta personalizada
server.port=8080

# Context path para suportar deployment em subdiretórios (ex: GitHub Pages)
server.servlet.context-path=/focuslog-api

# Customizar path do Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.configUrl=/focuslog-api/api-docs/swagger-config
springdoc.swagger-ui.url=/focuslog-api/api-docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always

spring.datasource.url=jdbc:h2:mem:focuslog
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT. Override JWT_SECRET in any real environment (HS256 needs at least 32 characters).
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
jwt.expiration=3600000

# Actuator / Micrometer metrics
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
