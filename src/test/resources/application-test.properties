# Tests run on in-memory H2, like the default profile, so no local MySQL is needed.
spring.datasource.url=jdbc:h2:mem:focuslog-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

jwt.secret=test-only-secret-0123456789abcdef0123456789
jwt.expiration=3600000
