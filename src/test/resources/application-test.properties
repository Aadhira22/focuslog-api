# Tests run on in-memory H2, like the default profile, so no local MySQL is needed.
# Unique DB name per Spring context: data.sql re-seeds on every startup, so contexts must not share a database.
spring.datasource.url=jdbc:h2:mem:focuslog-test-${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

jwt.secret=test-only-secret-0123456789abcdef0123456789
jwt.expiration=3600000